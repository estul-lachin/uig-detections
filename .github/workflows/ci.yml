name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Rebuild so "Seen on the honeypot" follows the hourly detections.json.
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # SOAR numbers for the site: an OIDC login whose only role is Log Analytics Reader on the workspace
      # (soar/grant-ci.sh). Only on main; if it fails, the site is built without the SOAR section.
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        id: azure
        if: github.ref == 'refs/heads/main' && vars.AZURE_CLIENT_ID != ''
        continue-on-error: true
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - if: steps.azure.outcome == 'success'
        run: python tools/soar_stats.py --out soar-stats.json || echo "::warning::SOAR stats unavailable"
      # Validate, run every rule against its test events, and fail if dist/ is stale.
      - run: >-
          python tools/build.py --check --site _site --soar soar-stats.json
          --hits https://raw.githubusercontent.com/estul-lachin/uig-honeypot-data/main/detections.json
      # The SOAR template must compile without linter warnings, and its scripts must parse.
      - run: |
          az bicep install
          az bicep lint -f soar/main.bicep --diagnostics-format sarif | python3 -c 'import json,sys; r=json.load(sys.stdin)["runs"][0]["results"]; [print(x["ruleId"], x["message"]["text"]) for x in r]; sys.exit(bool(r))'
          for f in soar/*.sh; do bash -n "$f"; done
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
