name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Rebuild so "Seen on the honeypot" follows the hourly detections.json.
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Validate, run every rule against its test events, and fail if dist/ is stale.
      - run: >-
          python tools/build.py --check --site _site
          --hits https://raw.githubusercontent.com/estul-lachin/uig-honeypot-data/main/detections.json
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
