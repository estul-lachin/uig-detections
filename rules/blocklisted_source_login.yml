title: Suricata IP Reputation Alert
name: suricata_reputation
id: 7fd2dd6e-2f56-4650-a5d3-75006e0288bd
status: experimental
description: Base rule for the blocklisted-source-login correlation. ET's CINS, DROP and COMPROMISED lists.
author: Estul Lachin
date: 2026-11-10
logsource:
  product: suricata
detection:
  selection:
    signature|startswith:
      - 'ET CINS '
      - 'ET DROP '
      - 'ET COMPROMISED '
  condition: selection
level: informational
