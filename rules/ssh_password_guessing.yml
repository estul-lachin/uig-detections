title: Password Guessing From One Source
id: 9a1edbdd-3518-4170-a9f7-7d476a9221d1
status: experimental
description: |
  One source tries five or more different passwords within ten minutes. Counting distinct passwords
  rather than failed logins ignores a client that retries the same wrong password, and catches
  dictionary attacks even when they are slow per connection.
references:
  - https://attack.mitre.org/techniques/T1110/001/
author: Estul Lachin
date: 2026-11-08
tags:
  - attack.credential-access
  - attack.t1110.001
correlation:
  type: value_count
  rules:
    - cowrie_failed_login
  group-by:
    - src_ip
  timespan: 10m
  condition:
    gte: 5
    field: password
falsepositives:
  - A user who forgot their password and tries many variants (rarely five within ten minutes)
level: medium
